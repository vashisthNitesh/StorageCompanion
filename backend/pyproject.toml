[project]
name = "speedcloud-backend"
version = "0.1.0"
description = "Privacy-first zero-knowledge subscription cloud storage platform"
authors = [{ name = "SpeedCloud Team" }]
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15.2",
    "djangorestframework-simplejwt>=5.3.1",
    "argon2-cffi>=23.1.0",
    "django-environ>=0.11.2",
    "psycopg[binary]>=3.2.1",
    "celery>=5.4.0",
    "redis>=5.0.8",
    "boto3>=1.35.15",
    "cryptography>=43.0.1",
    "pyotp>=2.9.0",
    "qrcode>=7.4.2",
    "pillow>=10.4.0",
    "gunicorn>=23.0.0",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-django>=4.9.0",
    "factory-boy>=3.3.1",
    "ruff>=0.6.4",
    "mypy>=1.11.2",
    "django-stubs>=5.0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "B", "UP", "N"]
lint.ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]
