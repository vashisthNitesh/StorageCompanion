services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: speedcloud_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 -k uvicorn.workers.UvicornWorker
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: speedcloud_celery_worker
    command: celery -A config worker --loglevel=info --concurrency=4
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - web
      - redis
    restart: always

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: speedcloud_celery_beat
    command: celery -A config beat --loglevel=info
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - web
      - redis
    restart: always

  db:
    image: postgres:16-alpine
    container_name: speedcloud_prod_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speedcloud_prod}
      POSTGRES_USER: ${POSTGRES_USER:-speedcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-speedcloud} -d ${POSTGRES_DB:-speedcloud_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: speedcloud_prod_redis
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  nginx:
    image: nginx:alpine
    container_name: speedcloud_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/app:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    restart: always

volumes:
  postgres_prod_data:
  redis_prod_data:
