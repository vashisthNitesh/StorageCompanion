# Render Blueprint for SmartSpace (single Docker container: nginx + Gunicorn).
# Values marked `sync: false` are secrets: set them in the Render dashboard, never in git.
services:
  - type: web
    name: speedcloud  # existing Render service name; renaming it would create a new service
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      # Derives vault keys for Google sign-in accounts. Set it once to the current
      # SECRET_KEY value and never change it, so SECRET_KEY can be rotated safely.
      - key: VAULT_KEY_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,smartspacedata.com,.smartspacedata.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://smartspacedata.com,https://*.smartspacedata.com"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_CURRENCY
        value: INR
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BUSINESS_NAME
        value: SmartSpace
      - key: BUSINESS_ADDRESS
        sync: false
      - key: BUSINESS_GSTIN
        sync: false
      - key: BUSINESS_STATE_CODE
        sync: false
      # SpaceByte storage (https://spacebyte.in/api-docs)
      - key: SPACEBYTE_BASE_URL
        value: https://spacebyte.in/api/v1
      - key: SPACEBYTE_ACCESS_TOKEN
        sync: false
      - key: SPACEBYTE_STORAGE_POOL_LIMIT_BYTES
        value: "1073741824000"
      - key: SPACEBYTE_PARENT_FOLDER_ID
        value: ""
