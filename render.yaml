services:
  - type: web
    name: speedcloud
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/plans
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: DEFAULT_CURRENCY
        value: INR
      - key: RAZORPAY_KEY_ID
        value: rzp_test_sample
      - key: RAZORPAY_KEY_SECRET
        value: sample_secret_key
      - key: RAZORPAY_WEBHOOK_SECRET
        value: sample_webhook_secret
      # SpaceByte Cloud Storage Upstream Integration (https://spacebyte.in/api-docs)
      - key: SPACEBYTE_BASE_URL
        value: https://spacebyte.in/api/v1
      - key: SPACEBYTE_ACCESS_TOKEN
        sync: false
      - key: SPACEBYTE_STORAGE_POOL_LIMIT_BYTES
        value: "1073741824000"
      - key: SPACEBYTE_PARENT_FOLDER_ID
        value: ""
      # If using a Render free database or external PostgreSQL (Supabase / Neon):
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: speedcloud-db
      #     property: connectionString

# Optional free database service on Render (uncomment if you want Render to provision PostgreSQL)
# databases:
#   - name: speedcloud-db
#     plan: free
#     databaseName: speedcloud
#     user: speedcloud_user
